
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "No Gradle settings file found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project found in: $DIR"
          ls -la "$DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Find generated APK files
        if: always()
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yadak-price-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
