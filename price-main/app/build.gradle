plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yadakprice.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.yadakprice.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // فایل‌های وب (client/) به‌صورت assets بسته‌بندی می‌شوند؛ فشرده‌سازی خودکار برای json/js/css غیرفعال
    // نیست و مشکلی ندارد چون WebViewAssetLoader خودش از AssetManager می‌خواند.
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
