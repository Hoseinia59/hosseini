<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یدک‌پرایس</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <div id="toast" class="toast"></div>

    <header class="topbar">
      <div class="topbar-left">
        <button id="menuToggle" class="menu-toggle" aria-label="باز کردن منو">☰</button>
      </div>

      <div class="topbar-right">
        <button id="voiceBtn" class="icon-btn" aria-label="جستجوی صوتی">🎤</button>
        <button id="settingsBtn" class="icon-btn" aria-label="تنظیمات">⚙️</button>
      </div>
    </header>

    <nav id="sideMenu" class="side-menu">
      <div class="side-head">
        <button id="menuClose" class="menu-close">×</button>
      </div>
      <button class="nav-item" data-goto="products">محصولات</button>
      <button class="nav-item" data-goto="rules">قواعد سود</button>
      <button class="nav-item" data-goto="history">تاریخچه</button>
      <button class="nav-item" data-goto="tools">ابزارها</button>
    </nav>

    <div id="menuShade" class="menu-shade"></div>

    <section class="car-hero">
      <div class="hero-brand-wrap">
        <div class="brand-badge">
          <span>یدک‌پرایس</span>
        </div>
        <div class="hero-subtitle">قیمت واقعی لوازم یدکی خودرو</div>
      </div>

      <div class="hero-car-frame">
        <img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1200&q=80" alt="خودرو" />
      </div>

      <div class="hero-bottom-lines"></div>

      <div class="home-search-shell">
        <input
          id="homeSearch"
          type="text"
          placeholder="نام قطعه، برند، کد فنی، OEM..."
          autocomplete="off"
          aria-label="جستجوی قطعه"
        />
        <div id="homeSearchPopup" class="homeSearchPopup hidden"></div>
      </div>
    </section>

    <main class="main-shell">
      <section id="products" class="pane active">
        <div class="toolbar">
          <input id="search" type="text" placeholder="جستجو..." />
          <button id="clearSearch" class="small-btn">پاک</button>
          <button id="addBtn" class="primary-btn">+ جدید</button>
        </div>

        <div class="filters">
          <select id="filterBrand">
            <option value="">همه برندها</option>
          </select>
          <select id="filterSource">
            <option value="">همه منابع</option>
          </select>
          <select id="filterPriceType">
            <option value="">همه نوع قیمتی</option>
            <option value="base">پایه</option>
            <option value="final">نهایی</option>
          </select>
          <input id="filterMinPrice" type="number" placeholder="حداقل قیمت" />
          <input id="filterMaxPrice" type="number" placeholder="حداکثر قیمت" />
          <label><input id="filterHasCode" type="checkbox" /> فقط کددار</label>
          <button id="clearFilters" class="small-btn">پاک کردن فیلتر</button>
        </div>

        <div id="countStat" class="count-stat">0 کالا</div>
        <div id="productList" class="product-list"></div>
        <button id="loadMoreBtn" class="load-more hidden">نمایش بیشتر</button>
        <div id="emptyProducts" class="empty hidden">هنوز کالایی ثبت نشده است.</div>
      </section>

      <section id="rules" class="pane">
        <form id="ruleForm" class="panel-form">
          <input id="ruleTerm" type="text" placeholder="نام یا عنوان" />
          <input id="ruleBrand" type="text" placeholder="برند" />
          <input id="rulePercent" type="number" step="0.1" value="10" placeholder="درصد سود" />
          <button type="submit" class="primary-btn">ثبت قاعده</button>
        </form>
        <div id="ruleList" class="mini-list"></div>
      </section>

      <section id="history" class="pane">
        <input id="historySearch" type="text" placeholder="جستجو در تاریخچه..." />
        <div id="historyList" class="mini-list"></div>
        <button id="historyMoreBtn" class="load-more hidden">بیشتر</button>
        <button id="clearHistory" class="small-btn danger">پاک کردن تاریخچه</button>
      </section>

      <section id="tools" class="pane">
        <div class="tool-grid">
          <label class="tool-btn">
            <input type="file" id="importFile" accept=".xlsx,.xls,.csv,.txt" hidden />
            <span>ورود اکسل</span>
          </label>

          <label class="tool-btn">
            <input type="file" id="restoreFile" accept=".json" hidden />
            <span>بازیابی</span>
          </label>

          <button id="backupBtn" class="tool-btn">پشتیبان</button>
          <button id="exportCsv" class="tool-btn">خروجی CSV</button>
          <button id="appearanceBtn" class="tool-btn">ظاهر</button>
        </div>

        <div id="sourceList" class="mini-list"></div>

        <form id="sourceForm" class="panel-form">
          <input id="sourceName" type="text" placeholder="نام منبع" />
          <input id="sourceType" type="text" placeholder="نوع منبع" />
          <button type="submit" class="primary-btn">ثبت منبع</button>
        </form>
      </section>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">عنوان</h3>
        <button id="closeModal" class="modal-close">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
